
name: Build ASGARI HOME updated APK
# CI validation for the dedicated update branch and pull requests.

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - chatgpt/write-access-check

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --no-pub --platforms=android --project-name asgari_home .

      - name: Restore main Dart source
        run: cp lib/main.dart.txt lib/main.dart

      - name: Set Android display name and internet permission
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/android:label="[^"]*"/android:label="asgarihome"/' "$MANIFEST"
          grep -q 'android.permission.INTERNET' "$MANIFEST" || \
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"

      - name: Configure permanent Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode \
            > android/app/asgarihome-release-key.jks

          test -s android/app/asgarihome-release-key.jks

          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=asgarihome\nstoreFile=asgarihome-release-key.jks\n' \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEYSTORE_PASSWORD" \
            > android/key.properties

      - name: Apply permanent signing configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          kts = Path("android/app/build.gradle.kts")
          groovy = Path("android/app/build.gradle")

          if kts.exists():
              path = kts
              is_kts = True
          elif groovy.exists():
              path = groovy
              is_kts = False
          else:
              raise SystemExit("Android Gradle file not found")

          source = path.read_text()

          if is_kts:
              header = """
          import java.util.Properties
          import java.io.FileInputStream

          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          keystoreProperties.load(FileInputStream(keystorePropertiesFile))

          """
              signing = """
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }
          """
              source = header + source
              source, count = re.subn(
                  r'android\s*\{',
                  lambda m: m.group(0) + "\n" + signing,
                  source,
                  count=1
              )
              if count != 1:
                  raise SystemExit("Could not configure Android signing")

              source, count = re.subn(
                  r'signingConfig\s*=\s*signingConfigs\.getByName\("debug"\)',
                  'signingConfig = signingConfigs.getByName("release")',
                  source
              )
          else:
              header = """
          import java.util.Properties
          import java.io.FileInputStream

          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

          """
              signing = """
              signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                  }
              }
          """
              source = header + source
              source, count = re.subn(
                  r'android\s*\{',
                  lambda m: m.group(0) + "\n" + signing,
                  source,
                  count=1
              )
              if count != 1:
                  raise SystemExit("Could not configure Android signing")

              source, count = re.subn(
                  r'signingConfig\s+signingConfigs\.debug',
                  'signingConfig signingConfigs.release',
                  source
              )

          if count != 1:
              raise SystemExit("Could not replace default debug signing")

          path.write_text(source)
          print("Permanent Android signing configured successfully")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Apply source update
        run: python3 tools/prepare_release.py

      - name: Run Flutter static analysis
        run: flutter analyze --no-pub

      - name: Generate launcher icon
        run: dart run flutter_launcher_icons

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL secret" && exit 1)
          test -n "$SUPABASE_ANON_KEY" || (echo "Missing SUPABASE_ANON_KEY secret" && exit 1)

          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Upload APK only
        uses: actions/upload-artifact@v4
        with:
          name: asgarihome-updated-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
