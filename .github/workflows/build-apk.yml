
name: Build ASGARI HOME APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Check ZIP file
        run: |
          ls -la
          test -f asgari_home_starter.zip

      - name: Extract project ZIP
        run: |
          mkdir -p appsrc
          unzip -o asgari_home_starter.zip -d appsrc

      - name: Show project structure
        run: |
          find appsrc -maxdepth 3 -type f | head -100
