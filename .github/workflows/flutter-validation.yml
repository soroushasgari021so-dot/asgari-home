name: Flutter validation (no release secrets)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --no-pub --platforms=android --project-name asgari_home .

      - name: Restore the tracked Dart source
        run: cp lib/main.dart.txt lib/main.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze --no-pub

      - name: Build a debug APK
        run: flutter build apk --debug --no-pub
