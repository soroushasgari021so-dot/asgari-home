name: asgari_home
description: Private real-estate management and public listings app for Amlak Asgari Nahavand.
publish_to: 'none'
version: 0.1.2+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  url_launcher: ^6.3.1
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  package_info_plus: ^8.3.1
  persian_datetimepickers: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/asgari_logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/app_icon.png
  min_sdk_android: 21
